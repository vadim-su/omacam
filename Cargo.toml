[package]
name = "omacam"
version = "0.1.0"
edition = "2024"
description = "macOS-style system virtual camera daemon with AI portrait effects for Linux / Omarchy"

[dependencies]
anyhow = "1"
bytemuck = { version = "1", features = ["derive"] }
clap = { version = "4", features = ["derive"] }
ctrlc = "3"
env_logger = "0.11"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
log = "0.4"
ort = { version = "=2.0.0-rc.15", features = ["download-binaries"] }
pipewire = { version = "0.10", features = ["v1_2_0"] }
pollster = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
v4l = "0.14"
wgpu = "30"
